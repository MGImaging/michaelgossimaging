<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michael Goss Imaging logo options</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e6e2da;
      color: #1a1a1a;
      font-family: Inter, Liberation Sans, Arial, sans-serif;
    }
    main { width: 1280px; padding: 36px 40px 48px; }
    h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
    p { margin: 8px 0 22px; color: #4d4942; font-size: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    figure { margin: 0; background: #fff; border-radius: 16px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 16px 16px; font-size: 18px; font-weight: 650; }
    figcaption span { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: #5c574e; }
  </style>
</head>
<body>
  <main>
    <h1>Michael Goss Imaging — logo options</h1>
    <p>Web design and AI automation. Not on the live site.</p>
    <div class="grid">
      <figure>
        <img src="a-caret.svg" alt="Option A">
        <figcaption>A <span>Caret — a screen and a prompt beside the name</span></figcaption>
      </figure>
      <figure>
        <img src="b-orbit.svg" alt="Option B">
        <figcaption>B <span>Orbit — a returning arrow around an M</span></figcaption>
      </figure>
      <figure>
        <img src="c-nodes.svg" alt="Option C">
        <figcaption>C <span>Nodes — a connected line over a mono wordmark</span></figcaption>
      </figure>
      <figure>
        <img src="d-editorial.svg" alt="Option D">
        <figcaption>D <span>Editorial — a large M and a small mark</span></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
